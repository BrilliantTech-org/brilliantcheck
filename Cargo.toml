[package]
name = "brilliantcheck"
version = "0.1.0"
edition = "2021"
description = "Universal device identity, authenticity verification and hardware diagnosis platform (Rust core)."
license = "MIT"
authors = ["Brilliant Tech"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true